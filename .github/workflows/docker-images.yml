name: Build Docker images

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'reports/**'
      - 'scripts/**'
      - '**.sql'
      - 'search-evals/**'
  workflow_dispatch:

concurrency:
  group: docker-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            dockerfile: Dockerfile
            image: ghcr.io/${{ github.repository }}
          - name: frontend
            dockerfile: Dockerfile.frontend
            image: ghcr.io/${{ github.repository }}-frontend

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Fingerprint PrimeUI license
        id: license
        env:
          PRIMEUI_LICENSE: ${{ secrets.PRIMEUI_LICENSE }}
        run: echo "hash=$(printf %s "$PRIMEUI_LICENSE" | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
          # Only the frontend Dockerfile mounts this; unset secret = build still succeeds (license badge shows).
          secrets: |
            primeui_license=${{ secrets.PRIMEUI_LICENSE }}
          build-args: |
            PRIMEUI_LICENSE_HASH=${{ steps.license.outputs.hash }}
