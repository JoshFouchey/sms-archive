plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.joshfouchey.smsarchive'
version = '0.0.1-SNAPSHOT'
description = 'sms-archive'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.apache.commons:commons-lang3:3.22.0'
    // Database & migration
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.postgresql:postgresql'

    // JSONB support for Postgres
    implementation 'io.hypersistence:hypersistence-utils-hibernate-73:3.16.0'

    // JAXB (needed for XML parsing if not included by default)
    implementation 'org.glassfish.jaxb:jaxb-runtime'

    // Utils
    implementation 'commons-io:commons-io:2.22.0'
    implementation 'net.coobird:thumbnailator:0.4.21'
    implementation 'com.github.ben-manes.caffeine:caffeine'

    // Spring AI — OpenAI-compatible integration for embeddings & LLM (works with llama.cpp)
    implementation platform('org.springframework.ai:spring-ai-bom:2.0.2')
    implementation 'org.springframework.ai:spring-ai-starter-model-openai'

    // pgvector JDBC type support
    implementation 'com.pgvector:pgvector:0.1.6'

    // Security & Auth additions
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.7'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.7'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.7'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-resttestclient'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.awaitility:awaitility'

    // Testcontainers for real Postgres in tests (ensures jsonb + functions work)
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
}


tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'spring.profiles.active', System.getProperty('spring.profiles.active', 'test')
    // Docker Desktop dropped engine API < 1.44; docker-java 3.4.x defaults to 1.32,
    // so Testcontainers fails discovery (400 on /info) without this override.
    systemProperty 'api.version', '1.44'
    jvmArgs += ['-XX:+EnableDynamicAgentLoading']
}

configurations.all { resolutionStrategy { force 'org.apache.commons:commons-compress:1.28.0' } }
